name = "conduit"
main = "BACKEND/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 50
script_size = 3_000_000

[[d1_databases]]
binding = "DB"
database_name = "conduit-prod"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[[kv_namespaces]]
binding = "KV"
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
preview_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[[r2_buckets]]
binding = "R2"
bucket_name = "conduit-assets"
preview_bucket_name = "conduit-assets-preview"

queues = [
  { binding = "WEBHOOK_QUEUE", queue_name = "webhook-delivery", max_batch_size = 10, max_batch_timeout = 30 },
  { binding = "EMAIL_QUEUE", queue_name = "email-delivery", max_batch_size = 50, max_batch_timeout = 60 }
]

[vars]
ENVIRONMENT = "production"
APP_URL = "https://conduithq.io"
APP_NAME = "Conduit"
RAZORPAY_KEY_ID = ""
RAZORPAY_KEY_SECRET = ""
RAZORPAY_WEBHOOK_SECRET = ""
PAYPAL_CLIENT_ID = ""
PAYPAL_CLIENT_SECRET = ""
PAYPAL_WEBHOOK_ID = ""
PAYPAL_MODE = "sandbox"
JWT_SECRET = ""
CRM_WEBHOOK_SECRET = ""

[build]
command = "npm run build"
watch_dir = ["BACKEND", "FRONTEND"]
